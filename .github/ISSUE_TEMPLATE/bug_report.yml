name: Bug report
description: Report a reproducible problem in the validator or its reports.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove credentials, personal data, and confidential rows before posting.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest command, redacted rules, and redacted input shape that reproduce the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "0.1.1 or main commit"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Runtime environment
      placeholder: "Python version, operating system, and CI runner if relevant"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Paste the relevant error, JSON result, or HTML report excerpt after removing sensitive values.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, personal data, and confidential source rows.
          required: true
