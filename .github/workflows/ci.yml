name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  package:
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --no-deps dist/*.whl
      - run: .venv/bin/open-data-quality examples/valid_sample.csv --rules examples/rules.json --output /tmp/quality.json --html-report /tmp/quality.html
      - name: Verify failing quality gate returns status 1
        shell: bash
        run: |
          set +e
          .venv/bin/open-data-quality examples/sample.csv --rules examples/rules.json --output /tmp/failed-quality.json
          exit_code=$?
          test "$exit_code" -eq 1
      - run: test -s /tmp/quality.json && test -s /tmp/quality.html && test -s /tmp/failed-quality.json
