[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-data-quality"
version = "0.1.0"
description = "A lightweight, configuration-driven data quality toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Bruce-Xu-git"}]
keywords = ["data-quality", "data-governance", "data-validation", "csv"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3"
]

[project.scripts]
open-data-quality = "open_data_quality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
